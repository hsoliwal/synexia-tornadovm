name: M3 CPU GPU Bulk Provider

on:
  pull_request:
    paths:
      - 'm3/cpu-gpu/src/main/java/com/synexia/m3/cpugpu/Rv32iBulk*.java'
      - 'm3/cpu-gpu/src/test/java/com/synexia/m3/cpugpu/Rv32iBulkExecutorTest.java'
      - 'm3/cpu-gpu/recipe-bulk-provider/**'
      - 'm3/cpu-gpu/docs/BULK_PROVIDER.md'
      - '.github/workflows/m3-cpu-gpu-bulk-provider.yml'
  workflow_dispatch:
    inputs:
      physical_gpu:
        description: 'Run verified TornadoVM GPU differential on a qualified self-hosted runner'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  recipe-fixed-point:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -ntp -f m3/cpu-gpu/recipe-bulk-provider/pom.xml test
      - run: mvn -B -ntp -f m3/cpu-gpu/recipe-bulk-provider/pom.xml rewrite:dryRun

  cpu-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          mvn -B -ntp -f m3/cpu-gpu/pom.xml             -Dtest=Rv32iBulkExecutorTest             -Dm3.gpu=false test

  physical-gpu-parity:
    if: github.event_name == 'workflow_dispatch' && inputs.physical_gpu
    runs-on: [self-hosted, linux, tornadovm-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          mvn -B -ntp -f m3/cpu-gpu/pom.xml             -Dtest=Rv32iBulkExecutorTest             -Dm3.gpu=true test
