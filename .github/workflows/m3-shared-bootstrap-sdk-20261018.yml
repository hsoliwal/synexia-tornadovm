# SPDX-License-Identifier: Apache-2.0
name: M3 Shared Canonical Bootstrap OpenRewrite SDK 20261018
on:
  pull_request:
    paths:
      - '.m3/openrewrite-recipes/src/test/java/com/synexia/m3/bootstrap/M3CanonicalSharedBootstrap20261018Test.java'
      - '.m3/SYNEXIA_SHARED_BOOTSTRAP_20261018.md'
      - '.github/workflows/m3-shared-bootstrap-sdk-20261018.yml'
  push:
    branches:
      - 'work/canonical-bootstrap-source-sealed-sdk-20261018'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-recipe-application:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check original canonical source Git blobs
        run: |
          set -euo pipefail
          test "$(git hash-object .m3/openrewrite-recipes/src/main/java/com/synexia/m3/bootstrap/M3BootstrapInventoryRecipe.java)" = 8f1018a1bcfa203420253d59a8473ef5a18e19b6
          test "$(git hash-object .m3/openrewrite-recipes/src/main/java/com/synexia/m3/bootstrap/M3BootstrapTaskRecipe.java)" = cfb9fb8befe2c5ccde5035e96ae7c99b89b5f490
      - name: Execute actual read-only OpenRewrite SDK and task refusal
        run: >
          mvn -B -ntp -f .m3/openrewrite-recipes/pom.xml
          -Dtest=M3CanonicalSharedBootstrap20261018Test test
      - name: Assert no production-source file changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = {
              ".m3/openrewrite-recipes/src/test/java/com/synexia/m3/bootstrap/M3CanonicalSharedBootstrap20261018Test.java",
              ".m3/SYNEXIA_SHARED_BOOTSTRAP_20261018.md",
              ".github/workflows/m3-shared-bootstrap-sdk-20261018.yml",
          }
          changed = subprocess.check_output([
              "git", "diff", "--name-only", "origin/master...HEAD"
          ], text=True).splitlines()
          assert set(changed) <= allowed, f"unexpected source changes: {changed}"
          PY
