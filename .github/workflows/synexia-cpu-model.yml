name: Synexia CPU-on-GPU

on:
  push:
    branches:
      - feature/riscv-cpu-on-gpu
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Compile and test CPU model
        run: mvn -Pjdk22plus -pl synexia-cpu-model -am test -DskipTests=false
