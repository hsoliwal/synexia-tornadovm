name: Synexia CPU-on-GPU

on:
  push:
    branches:
      - feature/riscv-cpu-on-gpu
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-model:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JVMCI source JDK 21
        id: jdk21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up build JDK 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "22"
          cache: maven

      - name: Install Graal bootstrap Python dependencies
        run: python3 -m pip install --disable-pip-version-check requests tqdm urllib3

      - name: Stage TornadoVM vendored Graal and JVMCI modules
        env:
          JVMCI_SOURCE_JDK: ${{ steps.jdk21.outputs.path }}
        run: python3 bin/pull_graal_jars.py --jdk jdk22plus

      - name: Compile and test CPU model
        run: ./mvnw -Pjdk22plus -pl synexia-cpu-model -am test -DskipTests=false
